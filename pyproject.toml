[project]
name = "interactive-live-engine"
version = "0.1.0"
description = "Reusable event-driven infrastructure for interactive live experiences"
requires-python = ">=3.12,<3.15"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
